spring.application.name=SpringSeecurityApp

# traer los datos del database.properties
spring.config.import=classpath:database.properties

# Postgres support
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.driver-class-name=${JDBC_DRIVER}
spring.datasource.url=jdbc:postgresql://${JDBC_HOST}:${JDBC_PORT}/${JDBC_DATABASE}?currentSchema=${JDBC_SCHEMA}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}
spring.jpa.show-sql=true

# Security Config
#spring.security.user.name=agustin
#spring.security.user.password=1234

JDBC_USERNAME=postgres
JDBC_PASSWORD=admin
JWT_SECRET=my-secret-key

jwt_secret=${JWT_SECRET}
jwt_expiration_minutes=15

app_name=Spring Security App